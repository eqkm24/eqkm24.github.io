<div class="wrap">
  <div class="page-hd">
    <div class="page-hd-label">스텔라 마을</div>
    <h1 class="page-hd-title">마을 <em>구역</em></h1>
    <p class="page-hd-sub">마을 청크 점유 현황 — <span class="zn-legend-hint">🟢 배정됨 &nbsp;⬜ 미배정(확보) &nbsp;🔒 미확보</span></p>
  </div>

  <!-- 통계 바 -->
  <div class="zn-stat-bar">
    <div class="zn-stat-item">
      <span class="zn-stat-val" id="zn-owned-count">0</span>
      <span class="zn-stat-label">배정 청크</span>
    </div>
    <div class="zn-stat-sep"></div>
    <div class="zn-stat-item">
      <span class="zn-stat-val" id="zn-acq-count">0</span>
      <span class="zn-stat-label">확보 청크</span>
    </div>
    <div class="zn-stat-sep"></div>
    <div class="zn-stat-item">
      <span class="zn-stat-val" id="zn-pct-count">0%</span>
      <span class="zn-stat-label">배정률</span>
    </div>
    <div class="zn-stat-sep"></div>
    <div class="zn-stat-item">
      <span class="zn-stat-val" id="zn-owner-count">0명</span>
      <span class="zn-stat-label">점유 인원</span>
    </div>
  </div>

  <!-- 관리자 컨트롤 -->
  <div class="zn-controls">
    <input class="input" id="zn-search" type="text" placeholder="🔍 소유자 검색..."
      oninput="highlightZone()" style="max-width:200px;">
    <button class="btn btn-sm" id="zn-bounds-btn" onclick="openBoundsModal()" style="display:none;">⚙ 경계 설정</button>
    <button class="btn btn-danger btn-sm" id="zn-reset-btn" onclick="resetZone()" style="display:none;">초기화</button>
  </div>

  <!-- 미확보 안내 (관리자용) -->
  <div id="zn-admin-hint" class="zn-admin-hint" style="display:none;">
    💡 <strong>🔒 미확보 청크</strong>를 클릭하면 확보/해제를 토글할 수 있어요.
  </div>

  <!-- 그리드 -->
  <div class="zn-map-wrap">
    <div class="zn-map" id="zn-map"></div>
  </div>

  <!-- 범례 -->
  <div class="zn-legend-wrap" id="zn-legend-wrap" style="display:none;">
    <div class="zn-legend-title">소유자 — 클릭해서 하이라이트</div>
    <div class="zn-legend" id="zn-legend"></div>
  </div>
</div>
