<div class="wrap">
  <div class="page-hd">
    <div class="page-hd-label">스텔라 마을</div>
    <h1 class="page-hd-title">마을 <em>구역</em></h1>
    <p class="page-hd-sub">마을 구역별 점유 현황 — 구역 카드를 클릭해 상세 정보를 확인하세요</p>
  </div>

  <!-- 요약 바 -->
  <div class="zone-summary-bar" id="zone-summary-bar" style="display:none;">
    <div class="zone-summary-item">
      <span class="zone-summary-label">총 구역</span>
      <span class="zone-summary-val" id="zs-total">0</span>
    </div>
    <div class="zone-summary-sep"></div>
    <div class="zone-summary-item">
      <span class="zone-summary-label">점유 청크</span>
      <span class="zone-summary-val" id="zs-chunks">0</span>
    </div>
    <div class="zone-summary-sep"></div>
    <div class="zone-summary-item">
      <span class="zone-summary-label">마을원 참여</span>
      <span class="zone-summary-val" id="zs-members">0명</span>
    </div>
  </div>

  <!-- 컨트롤 -->
  <div class="zone-toolbar">
    <input class="input" id="zone-search" type="text" placeholder="🔍 구역·소유자 검색..." oninput="filterZoneCards()" style="max-width:220px;">
    <div style="flex:1;"></div>
    <button class="btn btn-primary btn-sm" id="zone-add-btn" onclick="openZoneAddModal()" style="display:none;">+ 구역 추가</button>
  </div>

  <!-- 카드 그리드 -->
  <div class="zone-card-grid" id="zone-card-grid">
    <div class="empty"><div class="spinner"></div></div>
  </div>

  <!-- 빈 상태 -->
  <div class="empty" id="zone-empty" style="display:none;">
    <div class="empty-icon">🗺</div>
    <div>아직 등록된 구역이 없어요</div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px;">관리자가 구역을 추가할 수 있어요</div>
  </div>

  <div id="zone-modal-root"></div>
</div>
